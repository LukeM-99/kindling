# glx + --experimental-backends (picom 9 only rounds corners cleanly there). Super+G toggles picom off entirely.
backend = "glx";
vsync = false;  # picom 9 aborts if vsync is unsupported; tearing beats no compositor
use-damage = true;
unredir-if-possible = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [ "class_g = 'Tint2'", "_GTK_FRAME_EXTENTS@:c" ];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

corner-radius = 1;
rounded-corners-exclude = [ "class_g = 'Tint2'", "window_type = 'dock'", "window_type = 'desktop'" ];

wintypes: { dock = { shadow = false; }; dnd = { shadow = false; }; tooltip = { shadow = false; }; };
